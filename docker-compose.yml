services:
  postgres:
    image: postgres:16-alpine
    container_name: ultimate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ultimate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ultimate}
      POSTGRES_DB: ${POSTGRES_DB:-ultimate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ultimate} -d ${POSTGRES_DB:-ultimate}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ultimate-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ultimate}:${POSTGRES_PASSWORD:-ultimate}@postgres:5432/${POSTGRES_DB:-ultimate}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "${BACKEND_PORT:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
    container_name: ultimate-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
    ports:
      - "${FRONTEND_PORT:-3100}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
