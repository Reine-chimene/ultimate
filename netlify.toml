# Frontend ULTIMATE sur Netlify

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = ""
  API_PROXY_TARGET = "https://ultimate-api.fly.dev"

[[redirects]]
  from = "/api/v1/*"
  to = "https://ultimate-api.fly.dev/api/v1/:splat"
  status = 200
  force = true
