# Frontend ULTIMATE sur Netlify

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Vide = appels relatifs /api/v1/* proxifiés vers Fly.io (évite ERR_NAME_NOT_RESOLVED)
  NEXT_PUBLIC_API_URL = ""
  API_PROXY_TARGET = "https://ultimate-api.fly.dev"

# Proxy API → Fly.io (le navigateur ne contacte que netlify.app)
[[redirects]]
  from = "/api/v1/*"
  to = "https://ultimate-api.fly.dev/api/v1/:splat"
  status = 200
  force = true
